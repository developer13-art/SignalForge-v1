version: "3.9"

name: signalforge_prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: signalforge_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - signalforge_prod_net

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: production
    container_name: signalforge_server_prod
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: node src/index.js
    networks:
      - signalforge_prod_net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: production
    container_name: signalforge_client_prod
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - signalforge_prod_net

  nginx:
    image: nginx:1.27-alpine
    container_name: signalforge_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/sites:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - server
      - client
    networks:
      - signalforge_prod_net

volumes:
  postgres_data_prod:
    driver: local

networks:
  signalforge_prod_net:
    driver: bridge