[features]
resolution = true
skip-lint = false

[programs.localnet]
signalforge_attestation = "SFAttest1111111111111111111111111111111111"
signalforge_provenance = "SFProvenance11111111111111111111111111111"
signalforge_payment = "SFPayment1111111111111111111111111111111"

[programs.devnet]
signalforge_attestation = "SFAttest1111111111111111111111111111111111"
signalforge_provenance = "SFProvenance11111111111111111111111111111"
signalforge_payment = "SFPayment1111111111111111111111111111111"

[programs.mainnet]
signalforge_attestation = ""
signalforge_provenance = ""
signalforge_payment = ""

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
build = "anchor build"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false
genesis = [
  { address = "SFAttest1111111111111111111111111111111111", program = "./target/deploy/signalforge_attestation.so" },
  { address = "SFProvenance11111111111111111111111111111", program = "./target/deploy/signalforge_provenance.so" },
  { address = "SFPayment1111111111111111111111111111111", program = "./target/deploy/signalforge_payment.so" },
]

[test.validator]
url = "https://api.mainnet-beta.solana.com"
slots_per_epoch = 32
ticks_per_slot = 64

[[test.validator.clone]]
address = "So11111111111111111111111111111111111111112"

[[test.validator.clone]]
address = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"

[[test.validator.clone]]
address = "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB"

[[test.validator.account]]
address = "So11111111111111111111111111111111111111112"
filename = "tests/fixtures/wrapped_sol.json"

[workspace]
members = [
  "programs/signalforge-attestation",
  "programs/signalforge-provenance",
  "programs/signalforge-payment",
]