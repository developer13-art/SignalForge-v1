[workspace]
resolver = "2"
members = [
  "programs/signalforge-attestation",
  "programs/signalforge-provenance",
  "programs/signalforge-payment",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SignalForge Engineering <engineering@signalforge.ai>"]
license = "Proprietary"
homepage = "https://signalforge.ai"
repository = "https://github.com/signalforge/signalforge"

[workspace.dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "1.18.26"
spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "3.0.2", features = ["no-entrypoint"] }
thiserror = "1.0.63"
num-traits = "0.2.19"
bytemuck = { version = "1.16.3", features = ["derive"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1