# =============================================================
# SignalForge — Application Site Configuration
# =============================================================
# Serves the React client on the root domain and app subdomain.
# API requests are proxied to the Express server.
# =============================================================

# -------------------------------------------------------------
# HTTP → HTTPS redirect
# -------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name signalforge.ai www.signalforge.ai app.signalforge.ai api.signalforge.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------
# HTTPS — signalforge.ai (marketing site + API)
# -------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name signalforge.ai www.signalforge.ai;

    ssl_certificate /etc/nginx/certs/signalforge.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/signalforge.ai/privkey.pem;

    # SSL session cache
    ssl_session_cache shared:SSL_signalforge:10m;

    # Security headers (site-specific overrides)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.signalforge.ai; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.signalforge.ai wss://api.signalforge.ai; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # -----------------------------------------------------------
    # API proxy
    # -----------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_conn conn_per_ip 40;

        # Auth endpoints get stricter limits
        location ~ ^/api/(auth|login|register|forgot-password|reset-password) {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://signalforge_api;
        }

        # Signal endpoints
        location ~ ^/api/(signals|trades|positions) {
            limit_req zone=api_signal burst=30 nodelay;
            proxy_pass http://signalforge_api;
        }

        # Webhook endpoints
        location ~ ^/api/(webhooks|hooks)/ {
            limit_req zone=api_webhook burst=100 nodelay;
            proxy_pass http://signalforge_api;
        }

        proxy_pass http://signalforge_api;
    }

    location /health {
        access_log off;
        proxy_pass http://signalforge_api/health;
    }

    location /ready {
        access_log off;
        proxy_pass http://signalforge_api/ready;
    }

    # -----------------------------------------------------------
    # Static assets (long-lived cache)
    # -----------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico|map)$ {
        limit_req zone=static burst=200 nodelay;
        proxy_pass http://signalforge_client;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # -----------------------------------------------------------
    # Everything else → React client
    # -----------------------------------------------------------
    location / {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://signalforge_client;
    }
}

# -------------------------------------------------------------
# HTTPS — app.signalforge.ai
# -------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.signalforge.ai;

    ssl_certificate /etc/nginx/certs/app.signalforge.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/app.signalforge.ai/privkey.pem;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.signalforge.ai wss://api.signalforge.ai; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        limit_req zone=api_general burst=60 nodelay;
        limit_conn conn_per_ip 40;
        proxy_pass http://signalforge_client;
    }
}