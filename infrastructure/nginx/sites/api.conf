# =============================================================
# SignalForge — API Site Configuration
# =============================================================
# Routes all API traffic on api.signalforge.ai to the Express
# server. Supports REST, WebSocket, and long-polling endpoints.
# =============================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.signalforge.ai;

    ssl_certificate /etc/nginx/certs/api.signalforge.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api.signalforge.ai/privkey.pem;

    # API responses should not be cached by default
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;

    # Strict CORS enforcement
    add_header Access-Control-Allow-Origin "https://signalforge.ai, https://app.signalforge.ai" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-Id, X-Idempotency-Key" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "86400" always;

    # -----------------------------------------------------------
    # CORS preflight
    # -----------------------------------------------------------
    if ($request_method = OPTIONS) {
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # -----------------------------------------------------------
    # WebSocket upgrade (for real-time events)
    # -----------------------------------------------------------
    location /ws {
        proxy_pass http://signalforge_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -----------------------------------------------------------
    # Health / readiness (no logging)
    # -----------------------------------------------------------
    location = /health {
        access_log off;
        proxy_pass http://signalforge_api/health;
    }

    location = /ready {
        access_log off;
        proxy_pass http://signalforge_api/ready;
    }

    location = /metrics {
        access_log off;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://signalforge_api/metrics;
    }

    # -----------------------------------------------------------
    # Auth (strict limits)
    # -----------------------------------------------------------
    location ~ ^/(auth|login|register|password|2fa|kyc) {
        limit_req zone=api_auth burst=5 nodelay;
        limit_conn conn_per_ip 10;
        proxy_pass http://signalforge_api;
    }

    # -----------------------------------------------------------
    # Webhooks (loose limits, source-verified)
    # -----------------------------------------------------------
    location ~ ^/(webhooks|hooks)/ {
        limit_req zone=api_webhook burst=100 nodelay;
        client_max_body_size 10m;
        proxy_pass http://signalforge_api;
    }

    # -----------------------------------------------------------
    # Signal and trading endpoints (moderate limits)
    # -----------------------------------------------------------
    location ~ ^/(signals|trades|positions|risk|automation|execution) {
        limit_req zone=api_signal burst=30 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://signalforge_api;
    }

    # -----------------------------------------------------------
    # Solana endpoints
    # -----------------------------------------------------------
    location ~ ^/(solana|on-chain|attestations|provenance) {
        limit_req zone=api_signal burst=30 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://signalforge_api;
    }

    # -----------------------------------------------------------
    # Everything else
    # -----------------------------------------------------------
    location / {
        limit_req zone=api_general burst=60 nodelay;
        limit_conn conn_per_ip 40;
        proxy_pass http://signalforge_api;
    }
}