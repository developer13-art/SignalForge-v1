apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signalforge-ingress
  namespace: signalforge
  labels:
    app.kubernetes.io/name: signalforge
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://signalforge.ai,https://app.signalforge.ai"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Request-Id,X-Idempotency-Key"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/rate-limit: "120"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
    nginx.ingress.kubernetes.io/server-snippet: |
      location ~* /(health|ready|metrics)$ {
        access_log off;
      }
    nginx.ingress.kubernetes.io/websocket-services: signalforge-server
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - signalforge.ai
        - app.signalforge.ai
        - api.signalforge.ai
      secretName: signalforge-tls
  rules:
    - host: api.signalforge.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signalforge-server
                port:
                  number: 4000

    - host: app.signalforge.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signalforge-client
                port:
                  number: 3000

    - host: signalforge.ai
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: signalforge-server
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signalforge-client
                port:
                  number: 3000