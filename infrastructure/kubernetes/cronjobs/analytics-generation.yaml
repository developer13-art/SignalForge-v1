apiVersion: batch/v1
kind: CronJob
metadata:
  name: signalforge-analytics-generation
  namespace: signalforge
  labels:
    app.kubernetes.io/name: signalforge
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/function: analytics-generation
spec:
  schedule: "0 */4 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  suspend: false
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: signalforge
        app.kubernetes.io/component: cronjob
        app.kubernetes.io/function: analytics-generation
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: signalforge
            app.kubernetes.io/component: cronjob
            app.kubernetes.io/function: analytics-generation
        spec:
          restartPolicy: OnFailure
          serviceAccountName: signalforge-server
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: analytics-generation
              image: signalforge/server:1.0.0
              imagePullPolicy: IfNotPresent
              command: ["node", "src/scripts/generate-analytics.js"]
              envFrom:
                - configMapRef:
                    name: signalforge-config
                - secretRef:
                    name: signalforge-secrets
              resources:
                requests:
                  cpu: "250m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1024Mi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}