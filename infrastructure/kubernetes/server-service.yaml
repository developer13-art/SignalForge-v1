apiVersion: v1
kind: Service
metadata:
  name: signalforge-server
  namespace: signalforge
  labels:
    app.kubernetes.io/name: signalforge
    app.kubernetes.io/component: server
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: signalforge
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signalforge-server
  namespace: signalforge
  labels:
    app.kubernetes.io/name: signalforge
    app.kubernetes.io/component: server
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/signalforge-server-role"